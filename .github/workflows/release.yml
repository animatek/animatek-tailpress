name: Create Release

on:
  release:
    types:
      - created
  workflow_dispatch:  # For testing

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --quiet

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install npm dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Create zip archive
        run: |
          # La carpeta de dentro es el slug del tema en WordPress, para que la
          # actualizacion reemplace el tema y no instale uno nuevo al lado.
          # El nombre del zip sigue la convencion de Git Updater, $repo-$tag.zip,
          # y se deriva del repo para que siga valiendo si algun dia se renombra.
          mkdir animatek-tailpress
          rsync -a --exclude-from=.distignore --exclude=animatek-tailpress/ . animatek-tailpress/
          zip -rq ${{ github.event.repository.name }}-${{ github.ref_name }}.zip animatek-tailpress

      - name: Publish release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ github.event.repository.name }}-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
